[project]
name = "project-nov26-p4-destilacao"
version = "0.1.0"
description = "Destilação de um LLM em um classificador BERTimbau para triagem de reclamações em PT-BR."
readme = "README.md"
authors = [
    { name = "Gabriel MS", email = "krosct@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.42.1",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # erros, imports, bugs comuns, sintaxe moderna

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
train = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[tool.ruff.lint.per-file-ignores]
"scripts/publicar.py" = ["E501"]  # tabela Markdown do model card
